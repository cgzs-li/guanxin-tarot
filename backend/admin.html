<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#121016;color:#f2e9da;font:16px/1.8 "Microsoft YaHei",sans-serif}main{max-width:820px;margin:50px auto;padding:24px}h1{font:32px/1.5 Georgia,"SimSun",serif}p,small{color:#b9afbf}input,button,textarea{font:inherit;min-height:48px;border-radius:6px;padding:12px}input,textarea{width:100%;background:#211b28;color:#f2e9da;border:1px solid #65556a;margin:8px 0 20px}button{background:#d4b782;color:#17121c;border:0;cursor:pointer}button:disabled{opacity:.5}button:focus-visible,input:focus-visible{outline:2px solid #d4b782;outline-offset:3px}label{display:block}input[type=checkbox]{width:20px;min-height:20px;margin:0 10px 0 0}.error{color:#ffb6ae;min-height:28px;overflow-wrap:anywhere}.panel{border:1px solid #49404e;padding:24px;margin:24px 0;border-radius:10px}.row{display:flex;gap:12px;flex-wrap:wrap}.license{border-top:1px solid #49404e;padding:18px 0;overflow-wrap:anywhere}.license button{font-size:13px}a{color:#d4b782}[hidden]{display:none!important}code{overflow-wrap:anywhere}textarea{min-height:150px}@media(max-width:600px){main{margin:12px auto;padding:20px}.panel{padding:18px}h1{font-size:28px}}</style><title>观心 · 发码管理</title><style>nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}nav a{padding:10px 16px;border:1px solid #65556a;border-radius:6px;text-decoration:none}nav a[aria-current=page]{background:#d4b782;color:#17121c}.code{font-size:28px;letter-spacing:5px;color:#d4b782}.details{white-space:pre-line}h2{font-size:22px}main{max-width:920px}.record-actions{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0 8px;align-items:center}.record-actions button{margin:0;min-height:48px;white-space:nowrap}.license details{margin:12px 0}.license summary{cursor:pointer;padding:8px 0}</style></head><body><main><p>观心 · 本地管理</p><h1 id="title">生成激活码</h1><p>9.9 元 · 首次激活起30天 · 期间不限次数 · 绑定一个浏览器</p><form id="admin-login" class="panel"><label for="password">管理员口令</label><input type="password" id="password" autocomplete="current-password" required><button>登录管理页</button></form><p id="message" class="error" role="status"></p><section id="manage" hidden><nav aria-label="管理导航"><a href="/" data-page="/">生成激活码</a><a href="/records" data-page="/records">发码记录</a><a href="/activations" data-page="/activations">激活记录</a></nav><p id="summary"></p><section id="create-page"><p>先在小红书核实收款，再生成并发送激活码。这里不收款。</p><form id="create" class="panel"><label for="order">订单标记（不要填写姓名或手机号）</label><input id="order" maxlength="100" required placeholder="例如 TEST-001"><label><input type="checkbox" id="paid" required>已确认收到9.9元（演练请使用 TEST 标记）</label><button style="margin-top:20px">随机生成6位激活码</button></form></section><section id="list-page" hidden><p id="list-help"></p><button id="refresh-records">刷新记录</button><div id="records"></div><section id="history-section" hidden><h2>历史换码记录</h2><div id="history"></div></section></section><section id="delivery" class="panel" hidden><h2>发送给买家的内容</h2><textarea id="delivery-text" readonly></textarea><button id="copy">复制交付内容</button></section><button id="logout">退出管理</button></section></main><script>
const $=id=>document.getElementById(id);let busy=false,buyerUrl='',latest=[];
const page=location.pathname==='/admin'?'/':location.pathname;
$('title').textContent=page==='/records'?'发码记录':page==='/activations'?'激活记录':'生成激活码';
document.querySelectorAll('nav a').forEach(a=>{if(a.dataset.page===page)a.setAttribute('aria-current','page');});
const stamp=n=>n?new Date(n*1000).toLocaleString():'尚未发生';
function state(r){return !r.enabled?'已停用':r.expires_at&&r.expires_at<=Date.now()/1000?'已到期':r.bound?'使用中':r.activated?'等待重新绑定':'待激活';}
function deliveryText(r){return ['观心自我探索工具','使用链接：'+buyerUrl,'专属激活码：'+r.code_text,'售价9.9元，首次激活起30天内不限次数。'+(r.expires_at?'本次授权到期时间：'+stamp(r.expires_at)+'。':'尚未激活，首次激活时开始计时。'),'绑定首次激活的浏览器，请使用常用浏览器，避免无痕模式。换绑联系卖家，重置不延长有效期。','仅供娱乐与自我反思。'].join('\n');}
function delivery(r){$('delivery').hidden=false;$('delivery-text').value=deliveryText(r);$('delivery').scrollIntoView({block:'nearest'});}
async function api(path,data){const res=await fetch('/api/admin/'+path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await res.json();if(!res.ok){if(res.status===401){$('manage').hidden=true;$('admin-login').hidden=false;$('records').replaceChildren();$('history').replaceChildren();$('delivery-text').value='';latest=[];}throw Error(d.error);}return d;}
async function task(fn){if(busy)return;busy=true;$('message').textContent='处理中…';document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn();$('message').textContent='已完成';}catch(e){$('message').textContent=e.message;}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
function add(parent,tag,text,cls){const el=document.createElement(tag);el.textContent=text;if(cls)el.className=cls;parent.append(el);return el;}
async function refresh(){
 const d=await api('licenses');latest=d.licenses;buyerUrl=d.buyer_url||'';$('manage').hidden=false;$('admin-login').hidden=true;
 $('create-page').hidden=page!=='/';$('list-page').hidden=page==='/';
 $('summary').textContent='已发码 '+latest.length+' 个 · 使用中 '+latest.filter(r=>state(r)==='使用中').length+' 个 · 已到期 '+latest.filter(r=>state(r)==='已到期').length+' 个';
 $('list-help').textContent=page==='/records'?'查看当前激活码和交付内容。重置会作废旧码及登录，但不延长到期时间。旧版本未保存原码，需重置后才能显示。':'所有买家共用激活入口，各自使用激活码。设备类型为浏览器声明，仅供参考；访问包含刷新，解读次数可能因断网漏报。';
 $('records').replaceChildren();$('history').replaceChildren();
 const records=page==='/activations'?latest.filter(r=>r.activated):latest;
 if(page!=='/')for(const r of records){
  const item=add($('records'),'article','', 'license');const actions=document.createElement('div');actions.className='row record-actions';add(item,'h2',r.order_ref+' · '+state(r));
  if(page==='/records'){
   add(item,'p',r.code_text||'旧码未保存，请重置后查看','code');
   add(item,'p','订单首次发码：'+stamp(r.created)+'\n当前码发码：'+stamp(r.issued_at)+'\n首次激活：'+stamp(r.activated)+'\n到期时间：'+(r.expires_at?stamp(r.expires_at):'首次激活后30天'),'details');
   if(r.code_text){const details=document.createElement('details');add(details,'summary','展开交付内容');const t=add(details,'textarea','');t.value=deliveryText(r);t.readOnly=true;t.setAttribute('aria-label','订单 '+r.order_ref+' 的交付内容');item.append(details);const b=add(actions,'button','查看 / 复制交付内容');b.onclick=()=>delivery(r);}
  }else add(item,'p','首次激活：'+stamp(r.activated)+'\n到期：'+stamp(r.expires_at)+'\n最近活跃：'+stamp(r.last_seen)+'\n首次绑定设备：'+(r.device_label||'等待重新绑定')+'\n最近设备：'+(r.last_device||'暂无')+'\n访问 '+r.visits+' 次 · 阅读解读 '+r.readings+' 次 · 其他浏览器激活被拒 '+r.denied_bindings+' 次','details');
  item.append(actions);for(const [label,route] of [['重置换码','reset'],['停用','disable']]){const b=add(actions,'button',label);b.onclick=()=>{if(!confirm('确认'+label+'订单 '+r.order_ref+'？旧码或登录会失效，原到期时间不变。'))return;task(async()=>{await api(route,{id:r.id});await refresh();if(route==='reset')delivery(latest.find(x=>x.id===r.id));else{$('delivery').hidden=true;$('delivery-text').value='';}});};}
 }
 if(page!=='/'&&!records.length)$('records').textContent=page==='/activations'?'暂无激活记录。':'暂无发码记录。';
 $('history-section').hidden=page!=='/records'||!(d.history||[]).length;
 if(page==='/records')for(const r of d.history||[]){const item=add($('history'),'article','','license');add(item,'p',r.order_ref+' · 已换码作废');add(item,'p','旧码：'+(r.code_text||'旧版未保存')+'\n发码时间：'+stamp(r.issued_at)+'\n作废时间：'+stamp(r.retired_at),'details');}
}
$('admin-login').onsubmit=e=>{e.preventDefault();task(async()=>{await api('login',{password:$('password').value});$('password').value='';await refresh();});};
$('create').onsubmit=e=>{e.preventDefault();task(async()=>{const d=await api('create',{order_ref:$('order').value,paid:$('paid').checked});$('create').reset();await refresh();delivery(latest.find(r=>r.code_text===d.code));});};
$('copy').onclick=()=>task(async()=>{try{await navigator.clipboard.writeText($('delivery-text').value);}catch(e){$('delivery-text').focus();$('delivery-text').select();throw Error('请长按或按 Ctrl+C 复制选中的交付内容');}});
$('refresh-records').onclick=()=>task(refresh);
$('logout').onclick=()=>task(async()=>{await api('logout',{});location.replace('/');});
refresh().catch(()=>{});
</script></body></html>
