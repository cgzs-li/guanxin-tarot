<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#121016;color:#f2e9da;font:16px/1.8 "Microsoft YaHei",sans-serif}main{max-width:820px;margin:50px auto;padding:24px}h1{font:32px/1.5 Georgia,"SimSun",serif}p,small{color:#b9afbf}input,button,textarea{font:inherit;min-height:48px;border-radius:6px;padding:12px}input,textarea{width:100%;background:#211b28;color:#f2e9da;border:1px solid #65556a;margin:8px 0 20px}button{background:#d4b782;color:#17121c;border:0;cursor:pointer}button:disabled{opacity:.5}button:focus-visible,input:focus-visible{outline:2px solid #d4b782;outline-offset:3px}label{display:block}input[type=checkbox]{width:20px;min-height:20px;margin:0 10px 0 0}.error{color:#ffb6ae;min-height:28px;overflow-wrap:anywhere}.panel{border:1px solid #49404e;padding:24px;margin:24px 0;border-radius:10px}.row{display:flex;gap:12px;flex-wrap:wrap}.license{border-top:1px solid #49404e;padding:18px 0;overflow-wrap:anywhere}.license button{font-size:13px}a{color:#d4b782}[hidden]{display:none!important}code{overflow-wrap:anywhere}textarea{min-height:150px}@media(max-width:600px){main{margin:12px auto;padding:20px}.panel{padding:18px}h1{font-size:28px}}</style><title>观心 · 发码管理</title></head><body><main><p>本地试卖管理</p><h1>确认收款后，再发激活码。</h1><p>售价 9.9 元 · 不限次数 · 首次浏览器绑定<br>这里不会收款，也不会自动核实小红书订单。</p><form id="admin-login" class="panel"><label for="password">管理员口令</label><input type="password" id="password" autocomplete="current-password" required><button>登录管理页</button></form><p id="message" class="error" role="status"></p><section id="manage" hidden><form id="create" class="panel"><label for="order">订单标记（不要填写买家姓名或手机号）</label><input id="order" maxlength="100" placeholder="例如：TEST-001" required><label><input type="checkbox" id="paid" required>我已核对该订单收到 9.9 元（本地演练请用 TEST 标记）</label><button style="margin-top:20px">生成专属激活码</button></form><section id="delivery" class="panel" hidden><h2>发送给买家的内容</h2><p>激活码只在这次操作显示，请及时复制。数据库不保留明文。</p><textarea id="delivery-text" readonly></textarea><button id="copy">复制交付内容</button></section><h2>发码记录</h2><p>“重置并换码”会立即作废旧码及旧浏览器登录，请将新码发给买家。</p><button id="refresh-records">刷新使用统计</button><p id="summary"></p><p>访问次数包含刷新；解读次数来自页面上报，可能因断网漏报。最近活跃表示最近收到请求，不代表买家一直在操作。</p><div id="records"></div><button id="logout">退出管理</button></section></main><script>
const $=id=>document.getElementById(id);let busy=false;
async function api(path,data){const r=await fetch('/api/admin/'+path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok){if(r.status===401){$('manage').hidden=true;$('admin-login').hidden=false;}throw Error(d.error);}return d;}
async function task(fn){if(busy)return;busy=true;$('message').textContent='处理中…';document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn();$('message').textContent='已完成';}catch(e){$('message').textContent=e.message;}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
function delivery(code){$('delivery').hidden=false;$('delivery-text').value=['观心自我探索工具','使用链接：'+location.origin+'/','专属激活码：'+code,'9.9元，不限次数，绑定首次激活的浏览器。请勿在无痕模式激活。换浏览器或清除数据后请联系卖家。仅供娱乐与自我反思。'].join('\n');}
async function refresh(){const d=await api('licenses');$('manage').hidden=false;$('admin-login').hidden=true;$('summary').textContent='已发码 '+d.licenses.length+' 个 · 已绑定 '+d.licenses.filter(r=>r.bound).length+' 个 · 已停用 '+d.licenses.filter(r=>!r.enabled).length+' 个';$('records').replaceChildren();for(const record of d.licenses){const item=document.createElement('div');item.className='license';const text=document.createElement('p');text.textContent=record.order_ref+' · '+(!record.enabled?'已停用':record.bound?'已绑定':'待激活');item.append(text);const stats=document.createElement('p');const stamp=n=>n?new Date(n*1000).toLocaleString():'暂无';stats.textContent='激活：'+stamp(record.activated)+' ｜ 最近活跃：'+stamp(record.last_seen)+' ｜ 访问 '+(record.visits||0)+' 次 ｜ 阅读解读 '+(record.readings||0)+' 次';item.append(stats);const row=document.createElement('div');row.className='row';for(const [name,path] of [['重置并换码','reset'],['停用','disable']]){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{if(!confirm(name+'后，旧登录会失效。确认操作订单 '+record.order_ref+'？'))return;task(async()=>{const d=await api(path,{id:record.id});if(d.code)delivery(d.code);else $('delivery').hidden=true;await refresh();});};row.append(b);}item.append(row);$('records').append(item);}if(!d.licenses.length)$('records').textContent='暂无发码记录。';}
$('admin-login').onsubmit=e=>{e.preventDefault();task(async()=>{await api('login',{password:$('password').value});$('password').value='';await refresh();});};
$('create').onsubmit=e=>{e.preventDefault();task(async()=>{const d=await api('create',{order_ref:$('order').value,paid:$('paid').checked});delivery(d.code);$('create').reset();await refresh();});};
$('logout').onclick=()=>task(async()=>{await api('logout',{});$('manage').hidden=true;$('admin-login').hidden=false;$('delivery').hidden=true;$('delivery-text').value='';});
$('copy').onclick=()=>task(async()=>{try{await navigator.clipboard.writeText($('delivery-text').value);}catch(e){$('delivery-text').focus();$('delivery-text').select();throw Error('请长按或按 Ctrl+C 复制已选中的内容');}});
$('refresh-records').onclick=()=>task(refresh);
refresh().catch(()=>{});
</script></body></html>
