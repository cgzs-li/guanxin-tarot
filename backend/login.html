<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#121016;color:#f2e9da;font:16px/1.8 "Microsoft YaHei",sans-serif}main{max-width:820px;margin:50px auto;padding:24px}h1{font:32px/1.5 Georgia,"SimSun",serif}p,small{color:#b9afbf}input,button,textarea{font:inherit;min-height:48px;border-radius:6px;padding:12px}input,textarea{width:100%;background:#211b28;color:#f2e9da;border:1px solid #65556a;margin:8px 0 20px}button{background:#d4b782;color:#17121c;border:0;cursor:pointer}button:disabled{opacity:.5}button:focus-visible,input:focus-visible{outline:2px solid #d4b782;outline-offset:3px}label{display:block}input[type=checkbox]{width:20px;min-height:20px;margin:0 10px 0 0}.error{color:#ffb6ae;min-height:28px;overflow-wrap:anywhere}.panel{border:1px solid #49404e;padding:24px;margin:24px 0;border-radius:10px}.row{display:flex;gap:12px;flex-wrap:wrap}.license{border-top:1px solid #49404e;padding:18px 0;overflow-wrap:anywhere}.license button{font-size:13px}a{color:#d4b782}[hidden]{display:none!important}code{overflow-wrap:anywhere}textarea{min-height:150px}@media(max-width:600px){main{margin:12px auto;padding:20px}.panel{padding:18px}h1{font-size:28px}}</style><title>观心 · 激活你的探索</title></head><body><main style="max-width:560px"><p>GUAN XIN · TAROT</p><h1>留一点时间，<br>听见自己。</h1><p>输入购买后收到的专属激活码，进入观心。</p><section class="panel"><form id="login"><label for="code">你的6位激活码</label><input id="code" name="code" required maxlength="80" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="输入6位数字" inputmode="numeric"><button id="submit" style="width:100%">激活并进入</button><p id="message" class="error" role="status"></p></form></section><p>9.9 元 · 激活后不限次数使用</p><small>首次激活会绑定当前浏览器。请使用常用浏览器，避免无痕模式。更换浏览器或清除网站数据后，请联系卖家重置。登录凭证保存在本浏览器，不采集设备指纹。</small><p>使用统计：后台记录订单标记、激活时间、页面访问次数、解读次数和最近活跃时间、浏览器提供的系统和浏览器类型，用于授权管理及使用反馈。不上传你填写的问题或解读内容。刷新页面会增加访问次数；后台页面不等于在线。</p><p>仅供娱乐与自我反思。</p></main><script>
const form=document.getElementById('login'),button=document.getElementById('submit'),message=document.getElementById('message');
fetch('/api/session').then(r=>r.json()).then(d=>{if(d.active)location.replace('/app')}).catch(()=>{message.textContent='服务暂时不可用，请稍后刷新。'});
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;message.textContent='正在校验…';try{const r=await fetch('/api/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('code').value})});const d=await r.json();if(!r.ok)throw Error(d.error);location.replace('/app');}catch(err){message.textContent=err.message;}finally{button.disabled=false;}});
</script></body></html>
