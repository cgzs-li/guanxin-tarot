<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>观心 · 收款管理</title><link rel="stylesheet" href="/assets/admin.css"></head>
<body><main><a href="/">← 返回观心</a><h1>收款与开通</h1><p>仅供负责人使用。先在收款工具中核实真实到账，再确认订单；本站不会自动收款。</p>
<form id="lookup"><label for="admin-key">管理凭证</label><input id="admin-key" type="password" autocomplete="off" required minlength="32" placeholder="粘贴你的专用管理凭证"><label for="order-id">用户提供的订单号</label><input id="order-id" autocomplete="off" required maxlength="80"><button type="submit">查询订单</button></form>
<p id="status" role="status" aria-live="polite"></p>
<section id="order-panel" hidden><h2>核对订单</h2><dl><dt>账号</dt><dd id="username"></dd><dt>套餐</dt><dd id="product"></dd><dt>应收金额</dt><dd id="amount"></dd><dt>状态</dt><dd id="order-status"></dd></dl>
<form id="confirm"><label for="received">实际收款金额（元）</label><input id="received" type="number" min="0.01" step="0.01" required><label for="reference">真实收款流水编号</label><input id="reference" autocomplete="off" minlength="6" maxlength="100" required placeholder="收款工具中的交易流水号"><label class="check"><input id="verified" type="checkbox" required>我已核实真实到账，账号、套餐与金额均正确</label><button id="confirm-button" type="submit">确认收款并开通</button></form></section>
<section><h2>模型连接</h2><p>使用固定的虚构学习问题检测模型，每次会调用一次模型接口，不产生用户订单。</p><button id="model-check" type="button">检测 AI 连接</button><p id="model-status" role="status"></p></section>
<p class="note">管理凭证仅用于本次页面请求，不保存到浏览器。请勿发给用户或截图公开。重复确认同笔订单不会重复发放；同一收款流水不能开通多笔订单。</p>
</main><script src="/assets/admin.js"></script></body></html>
