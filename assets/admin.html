<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>观心 · 收款管理</title><link rel="stylesheet" href="/assets/admin.css?v=20261028-trial"></head>
<body><main><a href="/">← 返回观心</a><h1>收款与开通</h1><p>仅供负责人使用。先在收款工具中核实真实到账，再确认订单；本站不会自动收款。</p>
<form id="admin-login"><h2>后台登录</h2><label for="admin-username">用户名</label><input id="admin-username" autocomplete="username" maxlength="24" required><label for="admin-password">密码</label><input id="admin-password" type="password" autocomplete="current-password" maxlength="72" required><button type="submit">登录后台</button><p id="login-status" role="status"></p></form>
<div id="admin-workspace" hidden><p><a href="/">前往前台测试（无需充值） ↗</a></p><p>已登录：<strong id="admin-name"></strong> <button id="admin-logout" type="button">退出登录</button></p>
<p id="trial-admin-status" role="status"></p><section aria-labelledby="admin-feedback-title"><h2 id="admin-feedback-title">用户反馈</h2><p>集中查看用户解读后的评分和意见，不公开展示。</p><button id="feedback-refresh" type="button">刷新反馈</button><p id="feedback-list-status" role="status" aria-live="polite"></p><ol id="admin-feedback-list" class="feedback-list"></ol><button id="feedback-more" type="button" hidden>加载更早反馈</button></section>
<form id="lookup"><label for="order-id">用户提供的订单号</label><input id="order-id" autocomplete="off" required maxlength="80"><button type="submit">查询订单</button></form>
<p id="status" role="status" aria-live="polite"></p>
<section id="order-panel" hidden><h2>核对订单</h2><dl><dt>账号</dt><dd id="username"></dd><dt>套餐</dt><dd id="product"></dd><dt>应收金额</dt><dd id="amount"></dd><dt>状态</dt><dd id="order-status"></dd></dl>
<form id="confirm" novalidate><label for="received">实际收款金额（元）</label><input id="received" type="number" min="0.01" step="0.01" required aria-describedby="confirm-status"><label for="reference">真实收款流水编号</label><input id="reference" autocomplete="off" minlength="6" maxlength="100" required placeholder="收款工具中的交易流水号（至少6位）" aria-describedby="confirm-status"><label class="check"><input id="verified" type="checkbox" required>我已核实真实到账，账号、套餐与金额均正确</label><p id="confirm-status" role="status" aria-live="polite"></p><button id="confirm-button" type="submit">确认收款并开通</button></form></section>
<section><h2>模型连接</h2><p>使用固定的虚构学习问题检测模型，每次会调用一次模型接口，不产生用户订单。</p><button id="model-check" type="button">检测 AI 连接</button><p id="model-status" role="status"></p></section>
<p class="note">后台账号仅供负责人使用，登录会话两小时后过期。重复确认同笔订单不会重复发放；同一收款流水不能开通多笔订单。</p>
</div></main><script src="/assets/admin.js?v=20261028-trial"></script></body></html>
